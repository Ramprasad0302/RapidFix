plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Version and signing come from android-app/build.sh (or the environment).
def env = System.getenv()

android {
    namespace 'in.rapidfix.app'
    compileSdk 36

    defaultConfig {
        applicationId 'in.rapidfix.app'
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(env.RAPIDFIX_VERSION_CODE ?: '7')
        versionName env.RAPIDFIX_VERSION_NAME ?: '1.1.0'
        buildConfigField 'String', 'HOME_URL', '"https://rapidfix.in/"'
    }

    signingConfigs {
        release {
            if (env.RAPIDFIX_KEYSTORE) {
                storeFile file(env.RAPIDFIX_KEYSTORE)
                storePassword env.RAPIDFIX_KEYSTORE_PASSWORD
                keyAlias env.RAPIDFIX_KEY_ALIAS ?: 'rapidfix'
                keyPassword env.RAPIDFIX_KEY_PASSWORD ?: env.RAPIDFIX_KEYSTORE_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (env.RAPIDFIX_KEYSTORE) signingConfig signingConfigs.release
        }
        debug {
            // Emulator testing against the local dev server (adb reverse tcp:5173 tcp:5173).
            if (env.RAPIDFIX_DEBUG_URL) buildConfigField 'String', 'HOME_URL', "\"${env.RAPIDFIX_DEBUG_URL}\""
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
